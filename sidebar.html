<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧物流助手</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-content">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
          </svg>
          <span>智慧物流助手</span>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="refreshBtn" title="刷新数据">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 4 23 10 17 10"></polyline>
              <polyline points="1 20 1 14 7 14"></polyline>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
          </button>
          <button class="icon-btn" id="settingsBtn" title="设置">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
        </div>
      </div>
      <nav class="nav-tabs">
        <button class="nav-tab active" data-tab="batch">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="9" y1="14" x2="15" y2="14"></line>
            <line x1="9" y1="18" x2="15" y2="18"></line>
          </svg>
          <span>批量识别</span>
          <span class="badge" id="batchCount">0</span>
        </button>
        <button class="nav-tab" data-tab="route">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polygon points="10 8 16 12 10 16 10 8"></polygon>
          </svg>
          <span>路线检查</span>
          <span class="badge" id="routeCount">0</span>
        </button>
        <button class="nav-tab" data-tab="cost">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="1" x2="12" y2="23"></line>
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
          </svg>
          <span>费用提示</span>
          <span class="badge" id="costCount">0</span>
        </button>
        <button class="nav-tab" data-tab="exception">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
          <span>异常工单</span>
          <span class="badge" id="exceptionCount">0</span>
        </button>
      </nav>
    </header>

    <main class="app-main">
      <section class="tab-content active" id="tab-batch">
        <div class="action-bar">
          <button class="btn btn-primary" id="extractBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
            提取页面运单
          </button>
          <button class="btn btn-secondary" id="clearBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            清空数据
          </button>
          <button class="btn btn-success" id="checkBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            检查异常
          </button>
        </div>

        <div class="stats-bar">
          <div class="stat-item">
            <span class="stat-value" id="totalCount">0</span>
            <span class="stat-label">运单总数</span>
          </div>
          <div class="stat-item">
            <span class="stat-value stat-high" id="highCount">0</span>
            <span class="stat-label">高风险</span>
          </div>
          <div class="stat-item">
            <span class="stat-value stat-medium" id="mediumCount">0</span>
            <span class="stat-label">中风险</span>
          </div>
          <div class="stat-item">
            <span class="stat-value stat-low" id="lowCount">0</span>
            <span class="stat-label">低风险</span>
          </div>
        </div>

        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" placeholder="搜索运单号、地址...">
        </div>

        <div class="waybill-list" id="waybillList">
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
              <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
              <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
            <p>暂无运单数据</p>
            <p class="sub-text">点击"提取页面运单"按钮开始</p>
          </div>
        </div>
      </section>

      <section class="tab-content" id="tab-route">
        <div class="action-bar">
          <button class="btn btn-primary" id="analyzeRouteBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polygon points="10 8 16 12 10 16 10 8"></polygon>
            </svg>
            分析路线
          </button>
          <button class="btn btn-secondary" id="showMapBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
              <line x1="8" y1="2" x2="8" y2="18"></line>
              <line x1="16" y1="6" x2="16" y2="22"></line>
            </svg>
            地图预览
          </button>
        </div>

        <div class="map-container" id="mapContainer">
          <div class="map-placeholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
              <line x1="8" y1="2" x2="8" y2="18"></line>
              <line x1="16" y1="6" x2="16" y2="22"></line>
            </svg>
            <p>路线地图预览</p>
            <p class="sub-text">分析完成后将显示配送区域分布</p>
          </div>
        </div>

        <div class="route-analysis" id="routeAnalysis">
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="12" cy="12" r="10"></circle>
              <polygon points="10 8 16 12 10 16 10 8"></polygon>
            </svg>
            <p>暂无路线分析结果</p>
            <p class="sub-text">请先提取运单并点击"分析路线"</p>
          </div>
        </div>
      </section>

      <section class="tab-content" id="tab-cost">
        <div class="action-bar">
          <div class="carrier-selector">
            <label>选择承运商：</label>
            <select id="carrierSelect">
              <option value="">自动匹配</option>
            </select>
          </div>
          <button class="btn btn-primary" id="estimateCostBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="1" x2="12" y2="23"></line>
              <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
            </svg>
            估算费用
          </button>
        </div>

        <div class="cost-summary" id="costSummary">
          <div class="summary-card">
            <span class="summary-label">预估总费用</span>
            <span class="summary-value" id="totalCost">¥0.00</span>
          </div>
          <div class="summary-card">
            <span class="summary-label">平均单价</span>
            <span class="summary-value" id="avgCost">¥0.00</span>
          </div>
          <div class="summary-card">
            <span class="summary-label">预计送达时段</span>
            <span class="summary-value" id="avgTime">-</span>
          </div>
        </div>

        <div class="cost-list" id="costList">
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <line x1="12" y1="1" x2="12" y2="23"></line>
              <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
            </svg>
            <p>暂无费用估算结果</p>
            <p class="sub-text">请先提取运单并点击"估算费用"</p>
          </div>
        </div>
      </section>

      <section class="tab-content" id="tab-exception">
        <div class="action-bar">
          <button class="btn btn-primary" id="generateReportBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            生成异常报告
          </button>
          <button class="btn btn-success" id="exportBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            导出清单
          </button>
        </div>

        <div class="template-section">
          <div class="section-header">
            <h3>异常模板</h3>
            <button class="btn btn-sm btn-primary" id="addTemplateBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              新增模板
            </button>
          </div>
          <div class="template-list" id="templateList">
            <div class="empty-state small">
              <p>加载中...</p>
            </div>
          </div>
        </div>

        <div class="exception-work-order" id="exceptionWorkOrder">
          <div class="section-header">
            <h3>待处理异常工单</h3>
            <div class="filter-bar">
              <select id="exceptionFilter">
                <option value="all">全部异常</option>
                <option value="high">高风险</option>
                <option value="medium">中风险</option>
                <option value="low">低风险</option>
              </select>
            </div>
          </div>
          <div class="work-order-list" id="workOrderList">
            <div class="empty-state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                <line x1="12" y1="9" x2="12" y2="13"></line>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
              </svg>
              <p>暂无异常工单</p>
              <p class="sub-text">检查异常后将自动生成待处理工单</p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="detailModal">
      <div class="modal-header">
        <h3>运单详情</h3>
        <button class="icon-btn" id="closeModal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody">
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="copyWaybillBtn">复制运单号</button>
        <button class="btn btn-primary" id="applyTemplateBtn">应用模板</button>
        <button class="btn btn-success" id="saveRemarkBtn">保存备注</button>
      </div>
    </div>

    <div class="modal" id="templateModal" style="display: none;">
      <div class="modal-header">
        <h3>新增模板</h3>
        <button class="icon-btn" id="closeTemplateModal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>模板名称</label>
          <input type="text" id="templateName" placeholder="例如：地址不完整">
        </div>
        <div class="form-group">
          <label>模板类型</label>
          <select id="templateType">
            <option value="address">地址问题</option>
            <option value="area">超区问题</option>
            <option value="weight">重量问题</option>
            <option value="duplicate">重复问题</option>
            <option value="time">时效问题</option>
            <option value="route">路线问题</option>
          </select>
        </div>
        <div class="form-group">
          <label>模板内容</label>
          <textarea id="templateContent" rows="4" placeholder="请输入异常原因说明和处理建议..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelTemplateBtn">取消</button>
        <button class="btn btn-primary" id="saveTemplateBtn">保存模板</button>
      </div>
    </div>

    <div class="modal" id="settingsModal" style="display: none;">
      <div class="modal-header">
        <h3>系统设置</h3>
        <button class="icon-btn" id="closeSettingsModal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>超重阈值 (kg)</label>
          <input type="number" id="weightThreshold" value="50">
        </div>
        <div class="form-group">
          <label>地址最小长度</label>
          <input type="number" id="minAddressLength" value="10">
        </div>
        <div class="form-group">
          <label>地址最大长度</label>
          <input type="number" id="maxAddressLength" value="200">
        </div>
        <div class="form-group">
          <label>承运商配置</label>
          <div id="carrierConfigList" class="carrier-config">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelSettingsBtn">取消</button>
        <button class="btn btn-primary" id="saveSettingsBtn">保存设置</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="sidebar.js"></script>
</body>
</html>
